<style>

    html,

        padding: 0;

        width: 100%;
        height: 100%;

        font-family: Arial, sans-serif;

    }


    #map {

        width: 100%;
        height: 100%;

    }


    /* ---------------------------------------------------------
       Popup
       --------------------------------------------------------- */

    .popup {

        font-size: 14px;

        line-height: 1.4;

    }


    .popup h3 {

        margin-top: 0;
        margin-bottom: 8px;

        color: #0071ce;

    }


    .popup p {

        margin-top: 4px;
        margin-bottom: 4px;

    }


    /* ---------------------------------------------------------
       Marcador
       --------------------------------------------------------- */

    .marker {

        width: 32px;
        height: 32px;

        border-radius:
            50%
            50%
            50%
            0;

        background-color: #0071ce;

        border: 3px solid white;

        box-shadow:
            0 2px 6px
            rgba(0, 0, 0, 0.35);

        transform:
            rotate(-45deg);

        cursor: pointer;

    }


    .marker::after {

        content: "";

        position: absolute;

        width: 10px;
        height: 10px;

        background-color: white;

        border-radius: 50%;

        top: 8px;
        left: 8px;

    }

</style>

</head> <body>

    ];


    // =========================================================
    // CREAR MAPA
    // =========================================================

    const map = new maplibregl.Map({

        container:
            "map",

        style:
            "https://demotiles.maplibre.org/style.json",

        center: [
            -99.20,
            19.45
        ],

        zoom:
            8

    });


    // =========================================================
    // CONTROL DE ZOOM
    // =========================================================

    map.addControl(

        new maplibregl.NavigationControl(),

        "top-right"

    );


    // =========================================================
    // CREAR BOUNDS
    // =========================================================

    const bounds =
        new maplibregl.LngLatBounds();


    // =========================================================
    // CREAR MARCADORES
    // =========================================================

    tiendas.forEach(

        tienda => {


            // -------------------------------------------------
            // Crear elemento HTML del marcador
            // -------------------------------------------------

            const elemento =
                document.createElement("div");


            elemento.className =
                "marker";


            // -------------------------------------------------
            // Crear contenido del popup
            // -------------------------------------------------

            const popupHTML = `

                <div class="popup">

                    <h3>
                        ${tienda.nombre}
                    </h3>

                    <p>

                        <strong>
                            Tipo:
                        </strong>

                        ${tienda.tipo}

                    </p>


                    <p>

                        <strong>
                            Municipio:
                        </strong>

                        ${tienda.municipio}

                    </p>


                    <p>

                        <strong>
                            Dirección:
                        </strong>

                        <br>

                        ${tienda.direccion}

                    </p>


                    <p>

                        <strong>
                            GPS:
                        </strong>

                        <br>

                        ${tienda.lat},
                        ${tienda.lng}

                    </p>

                </div>

            `;


            // -------------------------------------------------
            // Crear marcador
            // -------------------------------------------------

            new maplibregl.Marker({

                element:
                    elemento

            })

            .setLngLat([

                tienda.lng,
                tienda.lat

            ])

            .setPopup(

                new maplibregl.Popup({

                    offset:
                        25

                })

                .setHTML(

                    popupHTML

                )

            )

            .addTo(map);


            // -------------------------------------------------
            // Agregar posición a los límites
            // -------------------------------------------------

            bounds.extend([

                tienda.lng,
                tienda.lat

            ]);

        }

    );


    // =========================================================
    // AJUSTAR MAPA A TODAS LAS TIENDAS
    // =========================================================

    if (

        tiendas.length >
        0

    ) {

        map.fitBounds(

            bounds,

            {

                padding:
                    60,

                maxZoom:
                    11

            }

        );

    }


</script>
